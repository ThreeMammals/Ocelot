name: Issue 714 validation

on:
  push:
    branches:
      - fix/issue-714-multipart-routing

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore --locked-mode ./Ocelot.slnx

      - name: Build acceptance tests
        run: dotnet build --no-restore ./acceptance/Ocelot.Acceptance.csproj --framework net10.0

      - name: Run issue 714 acceptance test
        run: dotnet test --no-restore --no-build --verbosity normal --framework net10.0 --project ./acceptance/Ocelot.Acceptance.csproj --filter "FullyQualifiedName~MultipartFormDataTests"
