  # Matrix build job having 2 dimensions (os, ver)
  build:
    strategy:
      max-parallel: 3
      matrix:
        os: [ubuntu, windows, macos]
        version: [ 8, 9, 10 ]
    runs-on: ${{ matrix.os }}-latest
    defaults:
      run:
        shell: bash
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: SH-scripts executable
      run: |
        chmod +x .github/steps/*.sh
        ls -l .github/steps/*.sh
    - name: Check .NET ${{ matrix.version }}
      id: check-dotnet
      run: ./.github/steps/check-dotnet.sh ${{ matrix.version }}
    - name: Setup .NET ${{ matrix.version }}
      # if: env.DOTNET${{ matrix.version }}_installed == 'false'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.version }}.x
        cache: true
        cache-dependency-path: |
          samples/**/packages.lock.json
          src/**/packages.lock.json
          test/**/packages.lock.json
    - name: .NET Info
      run: dotnet --info
    - name: Add DNS-records
      run: ./.github/steps/ubuntu.add-dns-records.sh  
    - name: Install certificate
      run: ./.github/steps/ubuntu.install-certificate.sh
    - name: Restore
      run: dotnet restore --locked-mode ./Ocelot.slnx
    - name: Build
      run: dotnet build --no-restore ./Ocelot.slnx --framework net${{ matrix.version }}.0
    - name: Unit Tests
      run: dotnet test --no-restore --no-build --verbosity normal --framework net${{ matrix.version }}.0 --settings coverlet.runsettings ./test/Ocelot.UnitTests/Ocelot.UnitTests.csproj
    - name: Acceptance Tests
      run: dotnet test --no-restore --no-build --verbosity normal --framework net${{ matrix.version }}.0 --settings coverlet.runsettings ./test/Ocelot.AcceptanceTests/Ocelot.AcceptanceTests.csproj

